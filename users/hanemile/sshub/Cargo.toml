[package]
name = "sshub"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sshub"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
russh      = "0.44"
russh-keys = "0.44"
rusqlite   = { version = "0.31", features = ["bundled"] }
tokio      = { version = "1", features = ["full"] }
uuid       = { version = "1", features = ["v4"] }
dirs       = "5"
anyhow     = "1"
async-trait = "0.1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
