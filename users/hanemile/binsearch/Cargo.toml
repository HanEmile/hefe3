[package]
name = "binsearch"
version = "0.1.0"
edition = "2021"
description = "weggli-style pattern search for disassembled binaries (x86/x86_64)"
authors = []

[[bin]]
name = "binsearch"
path = "src/main.rs"

[dependencies]
# iced-x86: pure-Rust x86/x86_64 disassembler
iced-x86 = { version = "1.21", features = ["decoder", "intel"] }

# object: cross-platform binary parsing (ELF, PE, Mach-O)
object = { version = "0.36", default-features = false, features = [
    "read", "elf", "pe", "macho", "std",
] }

# Fast non-cryptographic hash (3x faster than SipHash for short strings)
ahash = "0.8"

# Rayon: data-parallel scan over candidate windows
rayon = "1.10"

# SmallVec: stack-allocated Vec for operand lists (avoids heap for <=4 operands)
smallvec = { version = "1.13", features = ["const_generics"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
