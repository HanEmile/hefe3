version: "2"
sql:
  - engine: "sqlite"
    queries: "sql/queries"
    schema: "sql/schema/sqlite.sql"
    gen:
      go:
        package: "sqlitedb"
        out: "internal/storage/sqlite/queries"
        emit_json_tags: true
        emit_empty_slices: true
