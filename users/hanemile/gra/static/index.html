<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>gra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
        <div class="time">
            <span id="time">1234</span>
            </div>
        <div class="header-top">
            <input type="text" id="nodeInput" placeholder="Enter target (domain, IP, endpoint...)">
            <button onclick="addNode()">Add Node</button>
        </div>
        <div class="tabs">
            <button class="tab active" onclick="switchTab('graph')">Graph</button>
            <button class="tab" onclick="switchTab('jobs')">Jobs</button>
            <button class="tab" onclick="switchTab('queue')">Queue</button>
            <button class="tab" onclick="switchTab('config')">Configuration</button>
        </div>
    </div>

    <div id="graphTab" class="tab-content active">
        <div id="graph"></div>
    </div>

    <div id="jobsTab" class="tab-content">
        <div class="jobs-container">
            <h2 style="margin-bottom: 20px; color: #4a9eff;">Active Jobs</h2>
            <div id="jobsList"></div>
        </div>
        <div class="jobs-layout" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <h2 style="margin-bottom: 20px; color: #4a9eff;">Active Jobs</h2>
                <div id="jobsList"></div>
            </div>
            <div class="terminal-container">
                <h2 style="margin-bottom: 20px; color: #51cf66;">Live Output</h2>
                <div id="terminal" class="terminal-box">
                    <div style="color: #666;">Select a running job to see output...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="queueTab" class="tab-content">
        <div class="jobs-container">
            <h2 style="margin-bottom: 20px; color: #4a9eff;">Job Queue</h2>
            <div id="queueList"></div>
        </div>
    </div>

    <div id="configTab" class="tab-content">
        <div class="config-container">
            <div class="config-section">
                <h3>Global Settings</h3>
                <div class="field">
                    <label>Max Concurrent Jobs</label>
                    <input type="number" id="maxConcurrent" min="1" max="50" value="5">
                </div>
                <button onclick="saveConfig()">Save Settings</button>
            </div>

            <div class="config-section">
                <h3>Worker Machines</h3>
                <div id="workerList" class="worker-list"></div>
                <div class="add-worker-form">
                    <h4 style="color: #9ca3af; font-size: 14px;">Add New Worker</h4>
                    <input type="text" id="workerName" placeholder="Worker Name">
                    <div class="form-row">
                        <input type="text" id="workerIP" placeholder="IP Address">
                        <input type="number" id="workerCapacity" placeholder="Capacity" value="10">
                    </div>
                    <button onclick="addWorker()">Add Worker</button>
                </div>
            </div>
        </div>
    </div>

    <div id="sidePanel">
        <div class="panel-content">
            <div class="panel-header">
                <h2>Node Details</h2>
                <button class="close-btn" onclick="closePanel('sidePanel')">×</button>
            </div>
            <div class="field">
                <label>Name</label>
                <input type="text" id="nodeName">
            </div>
            <div class="field">
                <label>Base</label>
                <input type="text" id="nodeBase">
            </div>
            <div class="field">
                <label>New linked node</label>
                <input type="text" id="nodeManualInput" placeholder="Enter target (domain, IP, endpoint...)">
                <button onclick="addManualNode()">Add Node</button>
            </div>
            <div class="field">
                <label>Type</label>
                <select id="nodeType">
                    <option value="domain">Domain</option>
                    <option value="ip">IP Address</option>
                    <option value="endpoint">Endpoint</option>
                    <option value="subdomain">Subdomain</option>
                    <option value="port">Port</option>
                    <option value="service">Service</option>
                    <option value="path">Path</option>
                </select>
            </div>
            <button onclick="updateNode()">Save Changes</button>
            <div class="actions">
                <h3>Actions</h3>
                <button class="action-btn" onclick="runJob('fuzz')">🔍 Start Fuzzing</button>
                <button class="action-btn" onclick="runJob('spider')">🕷️ Spider Target</button>
                <button class="action-btn" onclick="runJob('portscan')">🔓 Port Scan</button>
                <button class="action-btn" onclick="runJob('subdomain')">📋 Subdomain Enum</button>
                <button class="action-btn" onclick="exportNode()">💾 Export Data</button>
            </div>
        </div>
    </div>

    <div id="configPanel">
        <div class="panel-content">
            <div class="panel-header">
                <h2 id="configType">Config</h2>
                <button class="close-btn" onclick="closePanel('configPanel')">×</button>
            </div>
        </div>
    </div>

    <script src="//cdn.jsdelivr.net/npm/force-graph"></script>
    <script src="/app.js"></script>
</body>
</html>
