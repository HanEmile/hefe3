<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lora8 - mesh</title>
<style>
  :root { --bg:#090e13; --panel:#101820; --border:#2c3a48; --fg:#e6edf3; --dim:#7d8b9c; --acc:#4cc2ff; --ok:#39d353; --bad:#ff6a5e; --warn:#e3b341; }
  * { box-sizing:border-box; margin:0; border-radius:0 !important; }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,Menlo,monospace; height:100vh; overflow:hidden; }
  #shell { display:grid; grid-template-rows:36px minmax(0,1fr); height:100vh; }
  #topbar { display:flex; align-items:center; gap:12px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--border); }
  #topbar h1 { font-size:13px; color:var(--acc); }

  #topnav { display:flex; gap:4px; align-items:center; margin-left:8px; }
  #topnav a { text-decoration:none; border:1px solid var(--border); padding:2px 10px; color:var(--dim); font-size:11px; }
  #topnav a:hover { color:var(--acc); border-color:var(--acc); }
  #topnav a.on { color:var(--fg); border-color:var(--acc); background:#16232e; }

  #topbar a { color:var(--dim); font-size:11px; text-decoration:none; border:1px solid var(--border); padding:1px 8px; }
  #topbar a:hover { color:var(--acc); border-color:var(--acc); }
  #main { display:grid; grid-template-columns:220px minmax(0,1fr); min-height:0; }
  #left { display:flex; flex-direction:column; border-right:1px solid var(--border); min-height:0; }
  #chans { flex:0 auto; padding:6px; overflow-y:auto; }
  .chanbtn { padding:7px 10px; margin:3px 0; border:1px solid var(--border); cursor:pointer; font-size:12px; }
  .chanbtn:hover { border-color:var(--acc); color:var(--acc); }
  .chanbtn.active { border-color:var(--acc); color:var(--acc); background:#131f2a; }
  #peershr { flex:1; overflow-y:auto; padding:6px; border-top:1px solid var(--border); font-size:11px; min-height:0; }
  #center { display:flex; flex-direction:column; min-height:0; }
  #messages { flex:1; overflow-y:auto; padding:10px 12px; }
  .msg { max-width:72%; margin:4px 0; padding:6px 10px; border-left:2px solid var(--ok); background:var(--panel); }
  .msg.mine { margin-left:auto; border-left-color:var(--acc); }
  .msg .meta { display:flex; gap:12px; font-size:10px; color:var(--dim); margin-bottom:2px; }
  .msg .who { font-weight:600; color:var(--ok); }
  .msg.mine .who { color:var(--acc); }
  .msg .text { white-space:pre-wrap; word-break:break-word; }
  .datemark { text-align:center; color:var(--dim); font-size:10px; margin:10px 0; }
  #compose { display:flex; gap:6px; padding:8px; border-top:1px solid var(--border); background:var(--panel); }
  #compose input { flex:1; background:#0d1117; color:var(--fg); border:1px solid var(--border); padding:7px 10px; font:inherit; }
  #compose select { background:#0d1117; color:var(--fg); border:1px solid var(--border); padding:5px 8px; font:inherit; }
  #compose button { background:#16232e; color:var(--fg); border:1px solid var(--border); padding:7px 14px; font:inherit; cursor:pointer; }
  #compose button:hover { border-color:var(--acc); color:var(--acc); }
</style>
</head>
<body>
<div id="shell">
  <header id="topbar">
    <h1>lora8</h1>
  <nav id="topnav">
    <a href="/">lite</a>
    <a href="/pro">power</a>
    <a class="on" href="/mesh">mesh</a>
  </nav>
    <span style="flex:1"></span>
    <span id="meshstate" style="color:var(--dim);font-size:11px"></span>
  </header>
  <div id="main">
    <div id="left">
      <div id="chans"></div>
      <div style="border-bottom:1px solid var(--border)"></div>
      <div id="peershr"></div>
    </div>
    <div id="center">
      <div id="messages"></div>
      <div id="compose">
        <select id="meshTo"><option value="broadcast">all</option></select>
        <input id="meshText" placeholder="say something.">
        <button onclick="meshSend()">send</button>
      </div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let meshChannels = [], meshActiveChan = 0, meshPeers = [], msgCache = [], lastMsgTs = 0;
async function jget(p){ try { const r = await fetch(p); return await r.json(); } catch(e){ return null; } }
async function post(url, body) {
  try { const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); return await r.json(); }
  catch(e){ return {error:String(e)}; }
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function findPeerName(num) {
  if (num === 'self' || num === undefined || num === null) return 'you';
  const p = meshPeers.find(x => x.num === num);
  return p ? (p.longName || p.shortName || '!' + (p.num||'').toString(16)) : '!' + (num !== undefined && num !== null ? num.toString(16) : '?');
}
function chanName(i){ const c = meshChannels.find(x=>x.index===i); return c?c.name:('ch'+(i||0)); }
function renderChans(){
  $('chans').innerHTML = meshChannels.map(c =>
    `<div class="chanbtn${c.index===meshActiveChan?' active':''}" data-ch="${c.index}">
      ${c.index} · ${esc(c.name)}${c.role===1?' <span style="color:var(--ok);font-size:9px">primary</span>':''}
     </div>`).join('');
  $('chans').querySelectorAll('[data-ch]').forEach(d => d.addEventListener('click', () => {
    meshActiveChan = parseInt(d.dataset.ch, 10);
    renderChans(); renderMsgs();
  }));
}
function renderMsgs(){
  const msgs = msgCache
    .filter(m => (m.channel??0) === meshActiveChan)
    .sort((a,b)=>a.when-b.when);
  let lastDay = '';
  $('messages').innerHTML = msgs.map(m => {
    const tm = new Date((m.when||0)*1000);
    const day = tm.toISOString().slice(5,10);
    const t = tm.toLocaleTimeString('de-DE',{hour12:false});
    const mine = m.from === 'self';
    const out = [];
    if (day !== lastDay) { out.push(`<div class="datemark">${day}</div>`); lastDay = day; }
    out.push(`<div class="msg${mine?' mine':''}">
      <div class="meta"><span class="who">${esc(findPeerName(m.from))}</span><span>${t}</span><span>${m.portnum||''}${m.hopStart?' · '+m.hopStart+' hops':''}</span></div>
      <div class="text">${esc(m.text||'[packet]')}</div>
    </div>`);
    return out.join('');
  }).join('');
  const el = $('messages');
  el.scrollTop = el.scrollHeight;
}
async function meshSend(){
  const text = $('meshText').value.trim();
  if (!text) return;
  const to = $('meshTo').value;
  const r = await post('/api/mesh/send', {to, text, channel: meshActiveChan});
  if (r && r.error) alert('send failed: '+r.error);
  $('meshText').value = '';
}
$('meshText').addEventListener('keydown', e => { if (e.key==='Enter') meshSend(); });

async function poll(){
  const chs = await jget('/api/mesh/channels');
  if (chs && chs.channels && chs.channels.length) {
    meshChannels = chs.channels;
    renderChans();
  }
  const pe = await jget('/api/mesh/peers');
  if (pe && !pe.error) {
    meshPeers = (pe.peers||[]).slice().sort((a,b)=>(b.lastHeard||0)-(a.lastHeard||0));
    $('peershr').innerHTML = meshPeers.slice(0,40).map(p =>
      `<div style="padding:3px 2px;border-bottom:1px solid #1b242f">
        <b>${esc(p.longName||'—')}</b> <span style="color:var(--dim)">${p.hwModel||''}</span>
        <div style="color:var(--dim)">${p.isFavorite?'★ ':''}!${(p.num||0).toString(16).padStart(8,'0')} · batt ${p.batteryLevel??'—'}% </div>
      </div>`).join('');
    $('meshstate').textContent = meshPeers.length + ' peers · ' + meshChannels.length + ' rooms';
  }
  const ms = await jget('/api/mesh/messages');
  if (ms && !ms.error && ms.messages) {
    // keep full cache; per-room filter is view-side
    msgCache = ms.messages;
    renderMsgs();
  }
}
setInterval(poll, 2500);
poll();
</script>
</body>
</html>
