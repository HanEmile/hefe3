<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lora8 // R11e-LR8</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2129; --border:#2d3943; --fg:#c8d3dc; --dim:#6b7a88; --acc:#58a6ff; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 ui-monospace,Menlo,monospace; }
  header { padding:10px 18px; border-bottom:1px solid var(--border); display:flex; gap:16px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; color:var(--acc); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; padding:12px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px; }
  .card h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; color:var(--dim); letter-spacing:.08em; }
  label { display:block; color:var(--dim); font-size:12px; margin-top:8px; }
  input, select, button { background:#0d1117; color:var(--fg); border:1px solid var(--border); border-radius:5px; padding:5px 8px; font:inherit; }
  input { width:100%; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:90px; }
  button { cursor:pointer; margin-top:10px; background:#1f2b36; border-color:#3d4956; }
  button:hover { border-color:var(--acc); color:var(--acc); }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { text-align:left; color:var(--dim); padding:3px 6px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel); }
  td { padding:3px 6px; border-bottom:1px solid #20272f; vertical-align:top; word-break:break-all; }
  .status { display:flex; gap:18px; flex-wrap:wrap; }
  .kv { min-width:100px; }
  .kv b { display:block; font-weight:normal; color:var(--dim); font-size:11px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; background:var(--bad); }
  .dot.on { background:var(--ok); }
  #rxlog { max-height:400px; overflow-y:auto; }
  #msg { color:var(--bad); padding:0 12px; white-space:pre-wrap; }
  .wide { grid-column:1/-1; }
  .barrow { display:flex; align-items:center; gap:8px; margin:2px 0; font-size:11px; }
  .barrow .lbl { width:110px; color:var(--dim); text-align:right; }
  .bar { height:10px; background:var(--acc); border-radius:2px; min-width:1px; transition:width .3s; }
  .bar.noise { background:#4a7c59; }
  .barrow .val { color:var(--dim); }
</style>
</head>
<body>
<header><h1>lora8</h1><span id="hdr" style="color:var(--dim)">MikroTik R11e-LR8 · SX1301</span><span id="eui" style="color:var(--ok)"></span></header>
<div id="msg"></div>
<div class="grid">

  <div class="card">
    <h2>Device</h2>
    <div class="status" id="status"></div>
    <label>Serial device</label>
    <input id="devpath" value="/dev/ttyACM0">
    <div class="row">
      <button onclick="post('/api/connect',{path:devpath.value})">connect</button>
      <button class="danger" onclick="post('/api/disconnect',{})">disconnect</button>
    </div>
  </div>

  <div class="card">
    <h2>Concentrator</h2>
    <div class="row">
      <div><label>RF0 freq (MHz)</label><input id="rf0" value="867.5"></div>
      <div><label>RF1 freq (MHz)</label><input id="rf1" value="868.5"></div>
    </div>
    <div class="row">
      <div><label><input type="checkbox" id="txena" checked style="width:auto"> TX enabled (RF0)</label></div>
      <div><label><input type="checkbox" id="pub" checked style="width:auto"> LoRaWAN public sync</label></div>
      <div><label><input type="checkbox" id="if8" style="width:auto"> std channel IF8</label></div>
    </div>
    <div class="row">
      <button onclick="start()">apply config + start</button>
      <button class="danger" onclick="post('/api/stop',{})">stop</button>
    </div>
  </div>

  <div class="card">
    <h2>Uplink forwarder (Semtech UDP)</h2>
    <label>LNS server (host:port)</label>
    <input id="fwdsrv" placeholder="eu1.cloud.thethings.network:1700">
    <div class="status" id="fwdstat"></div>
    <div class="row">
      <button onclick="fwd(1)">start forwarder</button>
      <button class="danger" onclick="fwd(0)">stop forwarder</button>
    </div>
  </div>

  <div class="card">
    <h2>Transmit</h2>
    <div class="row">
      <div><label>freq (MHz)</label><input id="txfreq" value="868.1"></div>
      <div><label>power (dBm)</label><input id="txpow" value="14"></div>
      <div><label>rf chain</label><select id="txrf"><option>0</option><option>1</option></select></div>
    </div>
    <div class="row">
      <div><label>SF</label><select id="txsf"><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div>
      <div><label>BW (kHz)</label><select id="txbw"><option>125</option><option>250</option><option>500</option></select></div>
      <div><label>CR</label><select id="txcr"><option value="1">4/5</option><option value="2">4/6</option><option value="3">4/7</option><option value="4" selected>4/8</option></select></div>
    </div>
    <label>payload (hex)</label>
    <input id="txpl" placeholder="48656c6c6f" >
    <div class="row">
      <button onclick="tx()">send now</button>
      <button class="danger" onclick="post('/api/aborttx',{})">abort tx</button>
    </div>
  </div>

  <div class="card wide">
    <h2>Live</h2>
    <div class="status" id="liveinfo"></div>
    <div id="noisebars" style="margin-top:10px"></div>
    <div class="row" style="margin-top:10px">
      <div><h2 style="margin:0 0 4px">packets / channel</h2><div id="chanhist"></div></div>
      <div><h2 style="margin:0 0 4px">packets / SF</h2><div id="sfhist"></div></div>
    </div>
  </div>

  <div class="card wide">
    <h2>Received packets <button style="margin:0 0 0 10px;padding:1px 8px" onclick="lastSeq=0;rxlog.innerHTML=''">clear</button></h2>
    <div id="rxlog"><table><thead><tr>
      <th>time</th><th>freq</th><th>if</th><th>mod</th><th>dr</th><th>rssi</th><th>snr</th><th>crc</th><th>len</th><th>payload (hex)</th>
    </tr></thead><tbody id="rxbody"></tbody></table></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const msg = t => { $('msg').textContent = t; setTimeout(()=>{ if($('msg').textContent===t) $('msg').textContent=''; }, 8000); };
async function post(url, body) {
  try {
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if (j.error) msg(j.error);
    return j;
  } catch(e) { msg(String(e)); }
}
async function get(url){ try { const r = await fetch(url); return await r.json(); } catch(e){ msg(String(e)); return null; } }

function buildCfg() {
  const rf0 = Math.round(parseFloat($('rf0').value)*1e6), rf1 = Math.round(parseFloat($('rf1').value)*1e6);
  const multi = (rf,f)=>({Enable:true,RFChain:rf,FreqHz:f,Bandwidth:3,Datarate:126,SyncWordSize:0,SyncWord:0});
  return {
    Board:{LorawanPublic:$('pub').checked, ClkSrc:1},
    RxRF:[
      {Enable:true,FreqHz:rf0,RssiOffset:-215.4,Type:2,TxEnable:$('txena').checked},
      {Enable:true,FreqHz:rf1,RssiOffset:-215.4,Type:2,TxEnable:false},
    ],
    RxIF:[
      multi(0,-400000),multi(0,-200000),multi(0,0),multi(0,200000),
      multi(1,-400000),multi(1,-200000),multi(1,0),multi(1,200000),
      {Enable:$('if8').checked,RFChain:1,FreqHz:-100000,Bandwidth:2,Datarate:2,SyncWordSize:0,SyncWord:0},
      {Enable:false,RFChain:1,FreqHz:300000,Bandwidth:2,Datarate:64000,SyncWordSize:0,SyncWord:0},
    ],
    Gain:{Size:2,LUT:[]}
  };
}
async function start() {
  const c = buildCfg();
  const r = await post('/api/config', c);
  if (!r || r.error) return;
  await post('/api/start', {});
}
async function tx() {
  await post('/api/tx', {
    freq_mhz: parseFloat($('txfreq').value), power: parseInt($('txpow').value),
    rf_chain: parseInt($('txrf').value), sf: parseInt($('txsf').value),
    bw_khz: parseInt($('txbw').value), cr: parseInt($('txcr').value),
    payload_hex: $('txpl').value, mode: 'immediate',
  });
}
async function fwd(on) {
  await post('/api/fwd', {server: $('fwdsrv').value, enable: !!on});
}

let lastSeq = 0;
const chanHist = {}, sfHist = {};
let lastCounters = null;
function bar(el, label, v, max, cls='bar') {
  return `<div class="barrow"><div class="lbl">${label}</div><div class="${cls}" style="width:${Math.max(1, Math.min(340, v/Math.max(1,max)*320))}px"></div><div class="val">${v}</div></div>`;
}
async function poll() {
  const st = await get('/api/status');
  if (st) {
    $('status').innerHTML = [
      `<div class="kv"><b>device</b><span class="dot ${st.connected?'on':''}"></span>${st.path||'—'}</div>`,
      `<div class="kv"><b>mcu uid</b>${st.mcu_uid||'—'}</div>`,
      `<div class="kv"><b>bridge fw</b>${st.mcu_fw||'—'}</div>`,
      `<div class="kv"><b>sx1301 ver</b>${st.chip||'—'}</div>`,
      `<div class="kv"><b>concentrator</b><span class="dot ${st.started?'on':''}"></span>${st.started?'running':'stopped'}</div>`,
      `<div class="kv"><b>µs counter</b>${st.trigcnt||0}</div>`,
      `<div class="kv"><b>tx</b>${['?','off','free','scheduled','emitting'][st.txstatus]||st.txstatus}</div>`,
    ].join('');
    if (st.eui) $('eui').textContent = 'gateway EUI: ' + st.eui;
  }
  const dg = await get('/api/diag');
  if (dg && !dg.error) {
    const dHdr = dg.hdr0 + dg.hdrMB + dg.hdrFSK;
    const dPkt = dg.pkt0 + dg.pktMB + dg.pktFSK;
    $('liveinfo').innerHTML = [
      `<div class="kv"><b>fifo</b>${dg.fifo}</div>`,
      `<div class="kv"><b>hdr hits</b>${dHdr}</div>`,
      `<div class="kv"><b>valid pkts</b>${dPkt}</div>`,
    ].join('');
    $('noisebars').innerHTML =
      bar(0,'channRSSI (noise)',dg.channRSSI,255,'bar noise') +
      bar(0,'bbRSSI',dg.bbRSSI,255,'bar noise') +
      bar(0,'decRSSI',dg.decRSSI,255,'bar noise');
    lastCounters = dg;
  }
  const fs = await get('/api/fwd');
  if (fs) {
    $('fwdstat').innerHTML = [
      `<div class="kv"><b>forwarder</b><span class="dot ${fs.running?'on':''}"></span>${fs.running?fs.server:'stopped'}</div>`,
      `<div class="kv"><b>lns link</b><span class="dot ${fs.connected?'on':''}"></span></div>`,
      `<div class="kv"><b>rx/fw</b>${fs.rxnb}/${fs.rxfw}</div>`,
      `<div class="kv"><b>tx</b>${fs.txnb}</div>`,
    ].join('');
  }
  const pk = await get('/api/packets?since='+lastSeq);
  if (pk && pk.length) {
    const tb = $('rxbody');
    for (const p of pk) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${p.time}</td><td>${p.freq_mhz}</td><td>${p.if}</td><td>${p.mod}</td><td>${p.dr}</td><td>${p.rssi}</td><td>${p.snr}</td><td>${p.crc}</td><td>${p.size}</td><td style="max-width:340px">${p.payload_hex}</td>`;
      tb.prepend(tr);
      lastSeq = Math.max(lastSeq, p.seq);
      const ch = p.freq_mhz;
      chanHist[ch] = (chanHist[ch]||0)+1;
      if (p.mod==='LORA') sfHist[p.dr] = (sfHist[p.dr]||0)+1;
    }
    $('chanhist').innerHTML = Object.keys(chanHist).sort().map(k=>bar(0,k+' MHz',chanHist[k],Math.max(1,...Object.values(chanHist)))).join('');
    $('sfhist').innerHTML = Object.keys(sfHist).sort().map(k=>bar(0,k,sfHist[k],Math.max(1,...Object.values(sfHist)))).join('');
    while (tb.rows.length > 300) tb.deleteRow(-1);
  }
}
setInterval(poll, 1000);
poll();
</script>
</body>
</html>
