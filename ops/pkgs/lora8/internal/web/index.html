<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lora8 // R11e-LR8</title>
<style>
  :root { --bg:#090e13; --panel:#101820; --border:#2c3a48; --fg:#e6edf3; --dim:#7d8b9c; --acc:#4cc2ff; --ok:#39d353; --bad:#ff6a5e; --warn:#e3b341; --dim2:#48525e; }
  * { box-sizing:border-box; border-radius:0 !important; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:12px/1.4 ui-monospace,Menlo,monospace; overflow:hidden; }

  #app { display:grid; height:100vh; grid-template-rows:34px minmax(0,1fr); }
  #topbar { display:flex; align-items:center; gap:14px; padding:0 12px; border-bottom:1px solid var(--border); background:var(--panel); }
  #topbar h1 { font-size:13px; margin:0; color:var(--acc); }
  #topbar .spacer { flex:1; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--bad); margin-right:4px; }
  .dot.on { background:var(--ok); }
  .dot.warn { background:var(--warn); }
  .topkv { color:var(--dim); white-space:nowrap; }
  .topkv b { color:var(--fg); font-weight:normal; }
  #msg { color:var(--bad); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #cols { display:grid; grid-template-columns:270px minmax(0,1fr) 300px; min-height:0; }
  .col { min-height:0; overflow-y:auto; border-right:1px solid var(--border); padding:6px; }
  .col:last-child { border-right:none; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:6px 8px; margin-bottom:6px; }
  .card h2 { margin:0 0 4px; font-size:10px; text-transform:uppercase; color:var(--dim); letter-spacing:.08em; display:flex; align-items:center; gap:6px; }
  .card h2 .tools { margin-left:auto; }
  .card h2 .tools button { margin:0; padding:0 4px; font-size:10px; line-height:16px; }
  .kv { display:flex; justify-content:space-between; gap:8px; padding:1px 0; }
  .kv span:first-child { color:var(--dim); }
  .kv b { font-weight:normal; }
  label { display:block; color:var(--dim); font-size:10px; margin-top:4px; }
  input, select, button { background:#0d1117; color:var(--fg); border:1px solid var(--border); border-radius:4px; padding:3px 6px; font:inherit; }
  input { width:100%; }
  button { cursor:pointer; background:#1c2833; border-color:#3d4956; }
  button:hover { border-color:var(--acc); color:var(--acc); }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  .btnrow { display:flex; gap:4px; margin-top:5px; }
  .btnrow button { flex:1; padding:3px 4px; font-size:11px; }
  .row { display:flex; gap:4px; }
  .row > div { flex:1; min-width:0; }
  .row label { margin-top:3px; }
  select, input { padding:2px 5px; }

  /* frames main */
  #frameswrap { display:flex; flex-direction:column; min-height:0; }
  #filterRow { display:flex; gap:4px; align-items:center; padding:6px; border-bottom:1px solid var(--border); background:var(--panel); }
  #filter { flex:1; }
  #filter.bad { border-color:var(--bad); }
  #filterRow button { padding:2px 10px; font-size:11px; }
  .chips { display:flex; flex-wrap:wrap; gap:3px; padding:3px 6px; border-bottom:1px solid var(--border); }
  .chip { background:#223140; border:1px solid var(--border); border-radius:3px; padding:0 5px; font-size:10px; }
  #frames { flex:1; overflow-y:auto; min-height:0; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th { text-align:left; color:var(--dim); padding:2px 5px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel); z-index:1; }
  td { padding:1px 5px; border-bottom:1px solid #1b232d; vertical-align:top; word-break:break-all; white-space:nowrap; }
  td:last-child { white-space:normal; }
  tr.framrow.rx { box-shadow:inset 2px 0 0 #2ea043; }
  tr.framrow.tx { box-shadow:inset 2px 0 0 #a371f7; }
  tr.framrow.txfail td { color:var(--bad); }
  .framrow td[data-v] { cursor:pointer; }
  .framrow td[data-v]:hover { background:#1d2833; color:var(--acc); }

  /* ctx menus */
  #ctxmenu { position:fixed; z-index:99; background:#161d26; border:1px solid var(--border); border-radius:6px; padding:4px; display:none; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  #ctxmenu .ctx-item { padding:3px 10px; font-size:11px; cursor:pointer; border-radius:4px; }
  #ctxmenu .ctx-item:hover { background:#223140; color:var(--acc); }
  #ctxmenu .ctx-title { padding:3px 10px 2px; font-size:9px; text-transform:uppercase; color:var(--dim); letter-spacing:.08em; border-bottom:1px solid var(--border); margin-bottom:2px; }
  #ctxmenu .ctx-ascii { padding:2px 10px 3px; font-size:11px; color:var(--ok); max-width:320px; word-break:break-all; }
  .ctx-btn { margin:0; padding:2px 7px; font-size:10px; }

  /* live/metrics bars */
  .barrow { display:flex; align-items:center; gap:6px; margin:1px 0; font-size:10px; flex-wrap:nowrap; white-space:nowrap; overflow:hidden; }
  .barrow .lbl { flex:0 0 92px; color:var(--dim); text-align:right; overflow:hidden; }
  .bar { height:9px; background:var(--acc); min-width:1px; transition:width .3s; }
  .bar.noise { background:#4a7c59; }
  .barrow .val { color:var(--fg); font-weight:bold; }
  .dir-rx { color:#3fb950; }
  .dir-tx { color:#a371f7; }
  td .ascii { color:var(--ok); font-style:italic; margin-right:5px; }
  .v-ok { color:var(--ok); }
  .v-bad { color:var(--bad); }
  .v-warn { color:var(--warn); }
  .v-info { color:var(--acc); }
  tr.framrow td.dimv { color:var(--dim); }
  .card h2 { color:var(--warn); }
  #topbar h1, .topkv b { color:var(--acc); }
  .framrow:hover td { background:#14202c; }

  #loglines { max-height:200px; overflow-y:auto; background:#0d1117; border:1px solid var(--border); border-radius:4px; padding:4px 6px; margin:4px 0 0; font-size:10px; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>lora8</h1>
    <span class="topkv">R11e-LR8 · SX1301</span>
    <span class="topkv" id="eui" style="color:var(--ok)"></span>
    <span class="topkv"><span class="dot" id="dot-dev"></span><span id="dot-dev-t">dev</span></span>
    <span class="topkv"><span class="dot" id="dot-run"></span><span id="dot-run-t">rx</span></span>
    <span class="topkv"><span class="dot" id="dot-fwd"></span><span id="dot-fwd-t">ttn</span></span>
    <span class="topkv" id="top-uptime"></span>
    <span class="spacer"></span>
    <span id="msg"></span>
  </header>
  <div id="cols">
    <!-- LEFT -->
    <div class="col">
      <div class="card">
        <h2>device</h2>
        <div class="status" id="status"></div>
        <label>serial</label>
        <input id="devpath" value="/dev/ttyACM0">
        <div class="btnrow">
          <button onclick="post('/api/connect',{path:devpath.value})">connect</button>
          <button class="danger" onclick="post('/api/disconnect',{})">disconnect</button>
        </div>
      </div>
      <div class="card">
        <h2>concentrator</h2>
        <div class="row">
          <div><label>rf0 mhz</label><input id="rf0" value="867.5"></div>
          <div><label>rf1 mhz</label><input id="rf1" value="868.5"></div>
        </div>
        <div class="row">
          <div><label><input type="checkbox" id="txena" checked style="width:auto">TX rf0</label></div>
          <div><label><input type="checkbox" id="pub" checked style="width:auto">public</label></div>
          <div><label><input type="checkbox" id="if8" style="width:auto">if8 std</label></div>
          <div><label><input type="checkbox" id="mesh" style="width:auto">mesh</label></div>
        </div>
        <div class="btnrow">
          <button onclick="start()">apply+start</button>
          <button class="danger" onclick="post('/api/stop',{})">stop</button>
        </div>
      </div>
      <div class="card">
        <h2>transmit</h2>
        <div class="row">
          <div><label>freq</label><input id="txfreq" value="869.525"></div>
          <div><label>dBm</label><input id="txpow" value="14"></div>
          <div><label>rf</label><select id="txrf"><option>0</option><option>1</option></select></div>
        </div>
        <div class="row">
          <div><label>sf</label><select id="txsf"><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div>
          <div><label>bw</label><select id="txbw"><option>125</option><option>250</option><option>500</option></select></div>
          <div><label>cr</label><select id="txcr"><option value="1">4/5</option><option value="2">4/6</option><option value="3">4/7</option><option value="4" selected>4/8</option></select></div>
        </div>
        <label>payload (hex)</label>
        <input id="txpl" placeholder="48656c6c6f">
        <div class="btnrow">
          <button onclick="tx()">send now</button>
          <button class="danger" onclick="post('/api/aborttx',{})">abort</button>
        </div>
      </div>
      <div class="card">
        <h2>forwarder (udp → ttn)</h2>
        <label>lns host:port</label>
        <input id="fwdsrv" placeholder="eu1.cloud.thethings.network:1700">
        <div class="status" id="fwdstat"></div>
        <div class="btnrow">
          <button onclick="fwd(1)">start</button>
          <button class="danger" onclick="fwd(0)">stop</button>
        </div>
      </div>
    </div>
    <!-- MAIN -->
    <div class="col" id="frameswrap">
      <div id="filterRow">
        <input id="filter" placeholder="filter: dir=tx and sf>9, crc=bad, ascii>=hello, hex>=4865, freq_mhz>=868, status=failed …  (click any cell)">
        <button onclick="applyFilterExpr()">apply</button>
        <button onclick="resetFilter()">clear</button>
      </div>
      <div class="chips" id="filterChips"></div>
      <div id="frames"><table><thead><tr>
        <th>time</th><th>dir</th><th>freq</th><th>rf</th><th>mod</th><th>sf</th><th>bw</th><th>cr</th>
        <th>rssi</th><th>snr</th><th>crc</th><th>power</th><th>toa</th><th>status</th><th>len</th><th>payload</th>
      </tr></thead><tbody id="fbody"></tbody></table></div>
    </div>
    <!-- RIGHT -->
    <div class="col">
      <div class="card">
        <h2>live counters</h2>
        <div class="status" id="liveinfo"></div>
        <div id="noisebars" style="margin-top:4px"></div>
      </div>
      <div class="card">
        <h2>channel / sf</h2>
        <div id="chanhist"></div>
        <div id="sfhist"></div>
      </div>
      <div class="card">
        <h2>state</h2>
        <div class="status" id="devstate"></div>
      </div>
      <div class="card">
        <h2>log <span class="tools"><button onclick="logpaused=!logpaused;logel.scrollTop=logel.scrollHeight">pause</button><button onclick="logel.textContent=''">clear</button></h2>
        <pre id="loglines"></pre>
      </div>
    </div>
  </div>
</div>
<div id="ctxmenu"></div>
<script>
let logpaused = false;
const $ = id => document.getElementById(id);
const logel = document.getElementById('loglines');
const msg = t => { $('msg').textContent = t; setTimeout(()=>{ if($('msg').textContent===t) $('msg').textContent=''; }, 8000); };
async function post(url, body) {
  try {
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json();
    if (j.error) msg(j.error);
    return j;
  } catch(e) { msg(String(e)); }
}
async function get(url){ try { const r = await fetch(url); return await r.json(); } catch(e){ msg(String(e)); return null; } }

function buildCfg() {
  const mesh = $('mesh').checked;
  // mesh mode: rf1 moves to 869.2 MHz so the meshtastic LongFast channel
  // (869.525 MHz, SF11/BW250) lands at IF +325kHz on the std chain; the
  // SX1301 "public" sync toggle is dropped to private (0x2B matches neither
  // anyway). Mirrors gw.MeshWatch().
  const rf0 = Math.round(parseFloat($('rf0').value)*1e6);
  const rf1 = mesh ? 869200000 : Math.round(parseFloat($('rf1').value)*1e6);
  const multi = (rf,f)=>({Enable:true,RFChain:rf,FreqHz:f,Bandwidth:3,Datarate:126,SyncWordSize:0,SyncWord:0});
  return {
    Board:{LorawanPublic: mesh ? false : $('pub').checked, ClkSrc:1},
    RxRF:[
      {Enable:true,FreqHz:rf0,RssiOffset:-215.4,Type:2,TxEnable:$('txena').checked},
      {Enable:true,FreqHz:rf1,RssiOffset:-215.4,Type:2,TxEnable:false},
    ],
    RxIF:[
      multi(0,-400000),multi(0,-200000),multi(0,0),multi(0,200000),
      multi(1,-400000),multi(1,-200000),multi(1,0),multi(1,200000),
      mesh
        ? {Enable:true,RFChain:1,FreqHz:325000,Bandwidth:2,Datarate:32,SyncWordSize:0,SyncWord:0}
        : {Enable:$('if8').checked,RFChain:1,FreqHz:-100000,Bandwidth:2,Datarate:2,SyncWordSize:0,SyncWord:0},
      {Enable:false,RFChain:1,FreqHz:300000,Bandwidth:2,Datarate:64000,SyncWordSize:0,SyncWord:0},
    ],
    Gain:{Size:2,LUT:[]}
  };
}
async function start() {
  const r = await post('/api/config', buildCfg());
  if (!r || r.error) return;
  await post('/api/start', {});
}
async function tx() {
  await post('/api/tx', {
    freq_mhz: parseFloat($('txfreq').value), power: parseInt($('txpow').value),
    rf_chain: parseInt($('txrf').value), sf: parseInt($('txsf').value),
    bw_khz: parseInt($('txbw').value), cr: parseInt($('txcr').value),
    payload_hex: $('txpl').value, mode: 'immediate',
  });
}
async function fwd(on) {
  const r = await post('/api/fwd', {server: $('fwdsrv').value, enable: !!on});
  if (r && !r.error) { msg('forwarder ' + (on ? 'started' : 'stopped')); poll(); }
}

// ================= frame log + filter engine =================
const NUMERIC = new Set(['freq_mhz','rf','if','sf','bw','cr','rssi','snr','power','toa_ms','size']);
const STRINGY = new Set(['dir','mod','crc','status','hex','err','ascii']);
function hexToAscii(hex) {
  if (!hex || hex.length % 2) return '';
  let out = '';
  for (let i = 0; i < hex.length; i += 2) {
    const c = parseInt(hex.substr(i, 2), 16);
    if (c >= 32 && c < 127) out += String.fromCharCode(c);
    else out += '';
  }
  return out;
}
function printableAscii(hex) {
  if (!hex || hex.length < 2) return null;
  const out = hexToAscii(hex);
  const printable = (out.match(/[ -~]/g) || []).length;
  const ratio = printable / (hex.length / 2);
  return ratio > 0.9 ? out : null;
}
const frameStore = []; // all fetched frames, in seq order
let lastSeq = 0;
let filterAst = null; // null = no filter

class FilterError extends Error {}

function tokenize(s) {
  const toks = [];
  const re = /\s*(>=|<=|!=|==|>|<|=|\(|\)|\bAND\b|\bOR\b|\bNOT\b|\band\b|\bor\b|\bnot\b|[A-Za-z_][A-Za-z0-9_]*|[^\s()>=<!]+)/g;
  let m;
  while ((m = re.exec(s)) !== null) toks.push(m[1]);
  return toks;
}

// grammar: or: and (OR and)*  and: not (AND not)*  not: NOT not | cmp | ( or )
class Parser {
  constructor(toks) { this.t = toks; this.i = 0; }
  peek() { return this.t[this.i]; }
  eat() { return this.t[this.i++]; }
  expectBool(op) {
    const t = this.eat();
    if (!t || t.toUpperCase() !== op) throw new FilterError(`expected ${op}, got "${t}"`);
  }
  parse() { const a = this.or(); if (this.i < this.t.length) throw new FilterError(`trailing "${this.peek()}"`); return a; }
  or()  { let l = this.and(); while (this.peek() && this.peek().toUpperCase() === 'OR')  { this.eat(); l = {op:'or', l, r:this.and()}; } return l; }
  and() { let l = this.not(); while (this.peek() && (this.peek().toUpperCase() === 'AND' || (!['()',')','OR','or'].includes(this.peek())))) { if (this.peek().toUpperCase()==='AND') this.eat(); l = {op:'and', l, r:this.not()}; } return l; }
  not() {
    const p = this.peek();
    if (!p) throw new FilterError('unexpected end');
    if (p.toUpperCase() === 'NOT') { this.eat(); return {op:'not', sub:this.not()}; }
    if (p === '(') { this.eat(); const a = this.or(); const c = this.eat(); if (c !== ')') throw new FilterError('missing )'); return a; }
    return this.cmp();
  }
  cmp() {
    const f = this.eat();
    if (!f || f === ')' || /^(and|or|not|\(|\))$/i.test(f)) throw new FilterError(`bad field "${f}"`);
    if (!NUMERIC.has(f) && !STRINGY.has(f)) throw new FilterError(`unknown field "${f}"`);
    const op = this.eat();
    if (!op || !/^(=|==|!=|>|<|>=|<=)$/.test(op)) throw new FilterError(`bad operator "${op}"`);
    const v = this.eat();
    if (v === undefined || v === '(' || v === ')') throw new FilterError(`missing value after ${op}`);
    return {op:'cmp', f, o: op === '=' ? '==' : op, v};
  }
}

function match(ast, fr) {
  switch (ast.op) {
    case 'and': return match(ast.l, fr) && match(ast.r, fr);
    case 'or':  return match(ast.l, fr) || match(ast.r, fr);
    case 'not': return !match(ast.sub, fr);
    case 'cmp': {
      if (fr[ast.f] === undefined || fr[ast.f] === null) return false;
      if (NUMERIC.has(ast.f)) {
        const a = Number(fr[ast.f]), b = Number(ast.v);
        if (isNaN(b)) return false;
        switch (ast.o) {
          case '==': return a === b;
          case '!=': return a !== b;
          case '>':  return a >  b;
          case '<':  return a <  b;
          case '>=': return a >= b;
          case '<=': return a <= b;
        }
      } else {
        const a = String(fr[ast.f]).toLowerCase(), b = ast.v.toLowerCase();
        switch (ast.o) {
          case '==': return a === b;
          case '!=': return a !== b;
          case '>':  return a.includes(b) && a !== b;
          case '<':  return a.includes(b) && a !== b;
          case '>=': return a.includes(b);
          case '<=': return a.includes(b);
        }
      }
      return false;
    }
  }
}

function applyFilterExpr() {
  const val = $('filter').value.trim();
  try {
    filterAst = val ? new Parser(tokenize(val)).parse() : null;
    $('filter').classList.remove('bad');
    renderFrames();
    renderChips();
  } catch (e) {
    $('filter').classList.add('bad');
    msg(e.message);
  }
}
function resetFilter() { $('filter').value=''; filterAst=null; $('filter').classList.remove('bad'); renderFrames(); renderChips(); }
$('filter').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilterExpr(); });

// click-a-field → apply-as-filter mini menu (wireshark style)
const ctx = $('ctxmenu');
function hideMenu(){ ctx.style.display='none'; }
document.addEventListener('click', e => { if (!ctx.contains(e.target)) hideMenu(); });
function showCtx(x, y, field, value, ascii) {
  const hdr = `<div class="ctx-title">apply as filter</div>` +
    (ascii ? `<div class="ctx-ascii">ascii: "${ascii.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}"</div>` : '');
  const opts = [
    ['AND ' + field + ' &equals; ' + value, () => addFilter('and', field, '==', value)],
    ['AND ' + field + ' &ne; ' + value, () => addFilter('and', field, '!=', value)],
    ['Or, '  + field + ' &equals; ' + value, () => addFilter('or',  field, '==', value)],
    ['Or, '  + field + ' &ne; ' + value, () => addFilter('or',  field, '!=', value)],
  ];
  ctx.innerHTML = hdr + opts.map((o,i)=>`<div data-i="${i}" class="ctx-item">${o[0]}</div>`).join('');
  ctx.querySelectorAll('.ctx-item').forEach(d => d.addEventListener('click', ev => { ev.stopPropagation(); opts[d.dataset.i][1](); hideMenu(); }));
  ctx.style.left = Math.min(x, innerWidth-280) + 'px';
  ctx.style.top = y + 'px';
  ctx.style.display = 'block';
}
function addFilter(boolop, field, rel, value) {
  const cur = $('filter').value.trim();
  const term = `${field}${rel}${value}`;
  $('filter').value = cur ? `${cur} ${boolop} ${term}` : term;
  applyFilterExpr();
}

function renderChips() {
  const v = $('filter').value.trim();
  $('filterChips').innerHTML = v ? v.split(/\s+(?:and|or)\s+/i).map(c=>`<span class="chip">${c}</span>`).join('') : '';
}

function frameCells(fr) {
  const d = f => f !== undefined && f !== null ? f : '·';
  const cell = (f, v, cls='') => `<td data-f="${f}" data-v="${v === undefined || v === null ? '' : v}" class="${cls}">${d(v)}</td>`;
  const status = fr.dir === 'tx' ? (fr.status === 'ok' ? 'ok' + (fr.toa_ms ? ` (${fr.toa_ms}ms)` : '') : 'failed') : (fr.crc || '·');
  const rssiCls = fr.rssi === undefined ? '' : (fr.rssi >= -100 ? 'v-ok' : fr.rssi >= -120 ? 'v-warn' : 'v-bad');
  const snrCls  = fr.snr  === undefined ? '' : (fr.snr  >= 0   ? 'v-ok' : fr.snr  >= -7  ? 'v-warn' : 'v-bad');
  return {
    html: [
      `<td class="dimv">${fr.time}</td>`,
      cell('dir', fr.dir, 'dir-' + fr.dir),
      cell('freq_mhz', fr.freq_mhz),
      cell('rf', fr.rf),
      cell('mod', fr.mod, fr.mod==='FSK'?'v-warn':''),
      cell('sf', fr.sf),
      cell('bw', fr.bw),
      cell('cr', fr.cr, 'dimv'),
      cell('rssi', fr.rssi, rssiCls),
      cell('snr', fr.snr, snrCls),
      cell('crc', fr.dir === 'rx' ? fr.crc : undefined, fr.crc === 'ok' ? 'v-ok' : fr.crc === 'bad' ? 'v-bad' : ''),
      cell('power', fr.power),
      cell('toa_ms', fr.toa_ms),

// ============== payload inspector + LoRaWAN parse/decrypt ==============
const MTYPES = {0:'Join Request',1:'Join Accept',2:'Unconfirmed Data Up',3:'Unconfirmed Data Down',4:'Confirmed Data Up',5:'Confirmed Data Down',6:'RFU',7:'Proprietary'};
function le16(b, i) { return b[i] | (b[i+1] << 8); }
function hexBytes(b) { return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join(''); }
function hexToU8(h) { const o = new Uint8Array(h.length/2); for (let i = 0; i < o.length; i++) o[i] = parseInt(h.substr(2*i,2),16); return o; }
function u8ToHex(a) { return Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join(''); }
function lorawanParse(hex) {
  if (hex.length < 24) return null;
  const b = hexToU8(hex);
  const mt = b[0] >> 5;
  const mic = hex.slice(-8);
  const body = {mtype: mt, mtypeName: MTYPES[mt] || ('mtype ' + mt), mic};
  if (mt === 0 && b.length === 23) {
    body.joinEUI = u8ToHex(b.slice(1,9).reverse());
    body.devEUI  = u8ToHex(b.slice(9,17).reverse());
    body.devNonce = le16(b, 17);
  } else if ((mt >= 2 && mt <= 5)) {
    body.devAddr = u8ToHex(b.slice(1,5).reverse());
    const fc = b[5];
    body.adr = !!(fc & 0x80);
    body.adrAckReq = !!(fc & 0x40);
    body.ack = !!(fc & 0x20);
    body.fPending = !!(fc & 0x10);
    body.fOptsLen = fc & 0x0f;
    body.fCnt = le16(b, 6);
    const fportIdx = 8 + body.fOptsLen;
    body.fOpts = u8ToHex(b.slice(8, fportIdx));
    const b2 = 1 + 7 + body.fOptsLen;
    body.frmLen = b.length - 4 - b2 - (b.length > 4 + b2 ? 1 : 0);
    if (body.frmLen > 0) { body.fPort = b[b2]; body.frm = u8ToHex(b.slice(b2+1, b.length-4)); }
    else { body.fPort = null; body.frm = ''; }
  }
  return body;
}

// ---- meshtastic guess ----
// LoRa wire layout (meshtastic/firmware src/mesh/RadioInterface.h PacketHeader):
// to(4 LE) from(4 LE) id(4 LE) flags(1) channel hash(1) next_hop(1) relay_node(1) | payload
// payload = AES-CTR encrypted meshtastic Data protobuf (default channel PSK),
// so we only do protobuf-lite guessing on it.
function le32(b, i) { return (b[i] | (b[i+1]<<8) | (b[i+2]<<16) | (b[i+3]<<24)) >>> 0; }
const PORTNUMS = {0:'unknown',1:'text',2:'remote_hw',3:'position',4:'nodeinfo',5:'routing',6:'admin',8:'waypoint',32:'reply',33:'ip_tunnel',34:'paxcounter',64:'serial',65:'store_forward',66:'range_test',67:'telemetry',68:'zeko',70:'map_report',71:'private',72:'ataks',256:'max'};
function meshParse(hex) {
  if (!hex || hex.length < 34) return null; // 16B header + ≥1B payload
  const b = hexToU8(hex);
  const to = le32(b, 0), from = le32(b, 4), id = le32(b, 8);
  // heuristics: broadcast dest, or node ids that look like !abcdxxxx (high byte 0)
  const broadcast = to === 0xffffffff;
  const nodeish = v => v !== 0 && v >= 0x100 && v < 0xffffff00;
  if (!broadcast && !(nodeish(to) && nodeish(from))) return null;
  const flags = b[12];
  const p = {
    to, from, id, broadcast,
    hopLimit: flags & 0x07,
    wantAck: !!(flags & 0x08),
    viaMqtt: !!(flags & 0x10),
    hopStart: (flags & 0xe0) >> 5,
    chanHash: b[13], nextHop: b[14], relayNode: b[15],
    payload: b.slice(16),
  };
  // protobuf-lite scan of the payload: field1 varint = portnum, field2 len-delimited = bytes
  // (meshtastic Data message — only readable when not encrypted, which is rare on-air)
  try {
    const d = p.payload;
    let i = 0;
    const varint = () => { let v = 0, s = 0; while (i < d.length) { const c = d[i++]; v |= (c & 0x7f) << s; s += 7; if (!(c & 0x80)) break; } return v >>> 0; };
    if (d.length >= 2 && d[0] === 0x08) { // field 1, wiretype 0 (varint)
      i = 1;
      p.portnum = varint();
      if (i < d.length && d[i] === 0x12) { // field 2, wiretype 2 (len-delim)
        i++;
        const n = varint();
        const bytes = d.slice(i, i + n);
        if (bytes.length === n) {
          p.pld = u8ToHex(bytes);
          p.pldAscii = printableAscii(p.pld);
          p.portnumName = PORTNUMS[p.portnum] || ('port ' + p.portnum);
        }
      }
    }
  } catch (e) { /* leave undefined */ }
  p.tailAscii = printableAscii(u8ToHex(p.payload));
  return p;
}

    const t = state.map(b=>AES_SBOX[b]);

async function aesRoundBlock(keyBytes, block) {

async function decryptFRMPayload(appSKeyHex, devAddrHex, dir, fCnt, frmHex) {
  const key = hexToU8(appSKeyHex);
  if (key.length !== 16) throw new Error('AppSKey must be 16 bytes (32 hex chars)');
  const addr = hexToU8(devAddrHex).reverse();
  const frm = hexToU8(frmHex);
  const nBlocks = Math.ceil(frm.length / 16);
  const plain = new Uint8Array(nBlocks * 16);
  for (let i = 1; i <= nBlocks; i++) {
    // K layout per spec: 0x01 | 0x00000000 | dir | DevAddr(LSB first) | FCnt 4B | 0x00 | blockNr
    const KB = new Uint8Array(16);
    KB[0]=0x01; KB[1]=KB[2]=KB[3]=KB[4]=0; KB[5+0]=dir;
    KB.set(addr,6); KB[10]=fCnt&0xff; KB[11]=(fCnt>>8)&0xff; KB[12]=0; KB[13]=0; KB[14]=0; KB[15]=i;

    for (let j = 0; j < 16; j++) plain[(i-1)*16+j] = frm[(i-1)*16+j] ^ s[j];
  }
  return plain.slice(0, frm.length);
}

let inspectorKey = localStorage.getItem('lora8.appskey') || '';

      if (lw.fPort !== null && lw.fPort !== undefined) info += `<br>fport ${lw.fPort}, ${lw.frmLen}B frm ${lw.frm}`; }

    m += `id 0x${f32(mp.id)} chan 0x${mp.chanHash.toString(16).padStart(2,'0')}`;
    m += ` next_hop 0x${mp.nextHop.toString(16).padStart(2,'0')} relay 0x${mp.relayNode.toString(16).padStart(2,'0')}<br>`;
    m += `hop ${mp.hopLimit}/${mp.hopStart}${mp.wantAck ? ' WANTACK' : ''}${mp.viaMqtt ? ' MQTT' : ''}`;
    if (mp.portnum !== undefined) {
      m += `<br>portnum ${mp.portnumName} (${mp.portnum})`;
      if (mp.pld) m += `<br>pld ${mp.pld}`;
      if (mp.pldAscii) m += `<br>text "${e(mp.pldAscii)}"`;
    } else {
      m += `<br><span style="color:var(--dim)">payload encrypted (AES-CTR, channel PSK)${mp.tailAscii ? ' · ascii-ish: "' + e(mp.tailAscii) + '"' : ''}</span>`;
    }
    m += `</div>`;
    info += m;
  }
  info += `<div class="ctx-ascii" style="max-width:300px;word-break:break-all;color:var(--dim)">${hex}</div>`;
  const isDataUp = lw && (lw.mtype === 2 || lw.mtype === 4) && lw.frm && lw.frm.length > 0;
  if (isDataUp) {
    info += `<div class="ctx-ascii">decrypt with AppSKey:<br>
      <input class="ctx-input" id="deckey" placeholder="32 hex chars" value="${inspectorKey}" style="width:260px;background:#0d1117;color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font:inherit;font-size:11px">
      <button class="ctx-btn" data-act="decrypt">decrypt</button>
      <span id="decout"></span></div>`;
  }
  const acts = [['copy hex', 'copyhex'], [ascii?'copy ascii':'', 'copyascii'], ['filter AND hex ≥ …', 'fand'], ['filter OR hex ≥ …', 'for']].filter(a=>a[0]);
  info += `<div style="display:flex;gap:4px;padding:4px 8px 6px">` +
    acts.map(a=>`<button class="ctx-btn" data-act="${a[1]}">${a[0]}</button>`).join('') + `</div>`;
  ctx.innerHTML = info;
  ctx.style.left = Math.min(x, innerWidth-340)+'px'; ctx.style.top = y+'px'; ctx.style.display='block';
  ctx.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', ev => {
    ev.stopPropagation();

    if (act === 'copyascii') navigator.clipboard.writeText(ascii).then(()=>{el.textContent='copied ✓';});

      if (fr.dir === 'rx') {
        const ch = fr.freq_mhz.toFixed(3);
        chanHist[ch] = (chanHist[ch]||0)+1;
        if (fr.mod === 'LORA' && fr.sf) sfHist['SF'+fr.sf] = (sfHist['SF'+fr.sf]||0)+1;
      }
    }
    if (frameStore.length > 1000) frameStore.splice(0, frameStore.length-1000);
    renderFrames();
    $('chanhist').innerHTML = Object.keys(chanHist).sort().map(k=>bar(0,k,chanHist[k],Math.max(1,...Object.values(chanHist)))).join('');
    $('sfhist').innerHTML = Object.keys(sfHist).sort().map(k=>bar(0,k,sfHist[k],Math.max(1,...Object.values(sfHist)))).join('');
  }
}
setInterval(poll, 1000);
poll();

</script>
</body>
